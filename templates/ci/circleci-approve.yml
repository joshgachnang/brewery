# brewery approve as a CircleCI job. Paste the job into your config (or continue-config.yml)
# and add it to the workflow after the test jobs, so check results for the head exist when it
# runs. It only acts on pull request pipelines and never fails the pipeline on its own verdict.
#
# Project environment variables (Project Settings → Environment Variables):
#   ANTHROPIC_API_KEY          the model key the read-only agent runs with
#   TERRENO_APP_ID             the terreno-approval-agent GitHub App id
#   TERRENO_APP_PRIVATE_KEY    its private key, PEM (literal \n sequences are fine)
#   TERRENO_APP_SLUG           optional; the App slug when it is not terreno-approval-agent
#   TERRENO_APP_INSTALLATION_ID optional; skips the installation lookup
# GH_TOKEN is still needed for the read side (gh pr view, gh pr diff): a GitHub App
# installation token works there too, or a fine-grained PAT with pull request read.
version: 2.1

jobs:
  approve:
    docker:
      - image: cimg/node:22.14
    resource_class: small
    environment:
      # A branch, tag, or commit sha of joshgachnang/brewery. This job holds the App key, so
      # pin a commit and bump it deliberately; master is the floor for a first try.
      BREWERY_REF: master
    steps:
      - checkout
      - run:
          name: Skip outside pull requests
          command: |
            if [ -z "${CIRCLE_PULL_REQUEST:-}" ]; then
              echo "Not a pull request pipeline; nothing to approve."
              circleci-agent step halt
            fi
      - run:
          name: Install bun and gh
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export PATH="$HOME/.bun/bin:$PATH"' >> "$BASH_ENV"
            if ! command -v gh >/dev/null; then
              curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
              sudo apt-get update -qq && sudo apt-get install -y -qq gh
            fi
      - run:
          name: Install Claude Code and brewery
          command: |
            sudo npm install -g @anthropic-ai/claude-code
            # Fetched by ref so BREWERY_REF can be a sha (clone --branch takes only branches and tags).
            git init -q "$HOME/brewery"
            git -C "$HOME/brewery" fetch -q --depth 1 https://github.com/joshgachnang/brewery.git "$BREWERY_REF"
            git -C "$HOME/brewery" checkout -q FETCH_HEAD
            cd "$HOME/brewery/cli" && bun install --frozen-lockfile
      - run:
          name: brewery approve
          # The verdict is posted to the PR; a not-approved verdict is not a pipeline failure.
          command: |
            # The base branch (change "master" if yours differs). The working tree becomes
            # the base from here on: nothing from the PR tree (bunfig.toml, .claude/, scripts)
            # runs while the App key is in the environment. The checked-out head stays in
            # the object store and brewery reads it with `git show <sha>:`.
            git fetch origin master
            git checkout --force origin/master
            PR="${CIRCLE_PULL_REQUEST##*/}"
            # --wait-checks: wait for the other checks on this head (limits.ciWaitMin), and
            # skip the head without spending a model when any failed or is still pending.
            bun "$HOME/brewery/cli/src/cli.ts" approve "$PR" --repo "$PWD" --wait-checks || echo "brewery approve could not produce a verdict (see above)"

